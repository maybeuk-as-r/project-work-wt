<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Defines the character encoding used by the webpage -->
  <meta charset="UTF-8">

  <!-- Makes the webpage responsive on mobile, tablet and desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title displayed in the browser tab -->
  <title>Register | Smart Attendance</title>

  <!-- Connects this page to the main CSS stylesheet -->
  <link rel="stylesheet" href="../css/style.css">

</head>


<!--
  auth-page is used for authentication pages
  such as Login and Register.
-->
<body class="auth-page">


  <!-- =====================================================
       MAIN AUTHENTICATION CONTAINER
       ===================================================== -->

  <!--
    single-auth means this registration page uses
    a single centered form instead of the two-column
    login layout.
  -->
  <div class="auth-shell single-auth">


    <!-- ===================================================
         REGISTRATION FORM AREA
         =================================================== -->

    <div class="auth-form-wrap">


      <!-- Link to return to the homepage -->
      <a class="back-link" href="../index.html">
        ← Back to home
      </a>


      <!-- =================================================
           REGISTRATION FORM BOX
           ================================================= -->

      <div class="form-box wide">


        <!-- Small section heading -->
        <span class="eyebrow">
          ACCOUNT SETUP
        </span>


        <!-- Main registration heading -->
        <h2>
          Create your account
        </h2>


        <!-- Short description -->
        <p class="muted">
          Registration UI for the Smart Attendance Management System.
        </p>



        <!-- =================================================
             REGISTRATION FORM
             ================================================= -->

        <!--
          id="registerForm" allows JavaScript to find
          and validate this form.

          novalidate disables the browser's default
          validation because our JavaScript handles it.
        -->
        <form
          id="registerForm"
          novalidate>


          <!-- =================================================
               FORM GRID
               ================================================= -->

          <!--
            form-grid arranges the form fields into
            multiple columns using CSS.
          -->
          <div class="form-grid">


            <!-- ===============================================
                 FULL NAME
                 =============================================== -->

            <div class="form-group">

              <!-- Label connected to the name input -->
              <label for="regName">
                Full name
              </label>


              <!--
                type="text" is used for normal text.

                required means the field cannot be empty.

                minlength="3" means at least 3 characters
                are required.
              -->
              <input
                id="regName"
                type="text"
                placeholder="Enter full name"
                required
                minlength="3"
              >


              <!--
                JavaScript displays validation errors here.
              -->
              <small class="error"></small>

            </div>



            <!-- ===============================================
                 EMAIL ADDRESS
                 =============================================== -->

            <div class="form-group">

              <label for="regEmail">
                Email address
              </label>


              <!--
                type="email" is used for email input.

                required means the user must enter
                an email address.
              -->
              <input
                id="regEmail"
                type="email"
                placeholder="name@college.edu"
                required
              >


              <!-- Email validation error appears here -->
              <small class="error"></small>

            </div>



            <!-- ===============================================
                 USER ROLE
                 =============================================== -->

            <div class="form-group">

              <label for="regRole">
                Role
              </label>


              <!--
                Dropdown used to select the type of user.
              -->
              <select
                id="regRole"
                required>


                <!-- Default empty option -->
                <option value="">
                  Select role
                </option>


                <!-- Student role -->
                <option>
                  Student
                </option>


                <!-- Teacher role -->
                <option>
                  Teacher
                </option>


                <!-- Administrator role -->
                <option>
                  Admin
                </option>

              </select>


              <!-- Role validation error -->
              <small class="error"></small>

            </div>



            <!-- ===============================================
                 ROLL / EMPLOYEE NUMBER
                 =============================================== -->

            <div class="form-group">

              <label for="regId">
                Roll / Employee number
              </label>


              <!--
                This field can contain either:
                - Student roll number
                - Teacher employee number
              -->
              <input
                id="regId"
                type="text"
                placeholder="e.g. 058"
                required
              >


              <!-- Validation error -->
              <small class="error"></small>

            </div>



            <!-- ===============================================
                 PASSWORD
                 =============================================== -->

            <div class="form-group">

              <label for="regPassword">
                Password
              </label>


              <!--
                type="password" hides the characters.

                minlength="6" requires at least
                six characters.

                required means it cannot be empty.
              -->
              <input
                id="regPassword"
                type="password"
                minlength="6"
                required
                placeholder="At least 6 characters"
              >


              <!-- Password validation error -->
              <small class="error"></small>

            </div>



            <!-- ===============================================
                 CONFIRM PASSWORD
                 =============================================== -->

            <div class="form-group">

              <label for="regConfirm">
                Confirm password
              </label>


              <!--
                The user enters the password again
                to make sure both passwords match.
              -->
              <input
                id="regConfirm"
                type="password"
                minlength="6"
                required
                placeholder="Repeat password"
              >


              <!--
                JavaScript displays an error if the
                passwords do not match.
              -->
              <small class="error"></small>

            </div>


          </div>



          <!-- =================================================
               TERMS AND CONDITIONS
               ================================================= -->

          <!--
            The checkbox must be selected before
            the account can be created.
          -->
          <label class="check terms">

            <input
              id="regTerms"
              type="checkbox"
              required>

            I agree to the account and attendance system terms.

          </label>


          <!--
            Displays an error if the user does not
            accept the terms.
          -->
          <small class="error terms-error"></small>



          <!-- =================================================
               CREATE ACCOUNT BUTTON
               ================================================= -->

          <button
            class="btn btn-primary full"
            type="submit">

            Create Account

          </button>


          <!--
            JavaScript displays the registration
            success or error message here.
          -->
          <div
            id="registerMessage"
            class="form-message">
          </div>


        </form>



        <!-- =================================================
             LOGIN LINK
             ================================================= -->

        <p class="auth-switch">

          Already registered?

          <!-- Takes the user to the login page -->
          <a href="login.html">
            Sign in
          </a>

        </p>


      </div>

    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT
       
       app.js handles:
       - Form validation
       - Required fields
       - Email validation
       - Minimum password length
       - Password matching
       - Terms and conditions
       - Success/error messages
       ===================================================== -->

  <script src="../js/app.js"></script>

</body>
</html>
