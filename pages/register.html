<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Smart Attendance</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="auth-page">
<div class="auth-shell single-auth"><div class="auth-form-wrap"><a class="back-link" href="../index.html">← Back to home</a><div class="form-box wide"><span class="eyebrow">ACCOUNT SETUP</span><h2>Create your account</h2><p class="muted">Registration UI for the Smart Attendance Management System.</p>
<form id="registerForm" novalidate>
<div class="form-grid">
<div class="form-group"><label for="regName">Full name</label><input id="regName" type="text" placeholder="Enter full name" required minlength="3"><small class="error"></small></div>
<div class="form-group"><label for="regEmail">Email address</label><input id="regEmail" type="email" placeholder="name@college.edu" required><small class="error"></small></div>
<div class="form-group"><label for="regRole">Role</label><select id="regRole" required><option value="">Select role</option><option>Student</option><option>Teacher</option><option>Admin</option></select><small class="error"></small></div>
<div class="form-group"><label for="regId">Roll / Employee number</label><input id="regId" type="text" placeholder="e.g. 058" required><small class="error"></small></div>
<div class="form-group"><label for="regPassword">Password</label><input id="regPassword" type="password" minlength="6" required placeholder="At least 6 characters"><small class="error"></small></div>
<div class="form-group"><label for="regConfirm">Confirm password</label><input id="regConfirm" type="password" minlength="6" required placeholder="Repeat password"><small class="error"></small></div>
</div>
<label class="check terms"><input id="regTerms" type="checkbox" required> I agree to the account and attendance system terms.</label><small class="error terms-error"></small>
<button class="btn btn-primary full" type="submit">Create Account</button><div id="registerMessage" class="form-message"></div>
</form><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></div></div></div><script src="../js/app.js"></script></body></html>
