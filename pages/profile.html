<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Defines the character encoding used by the webpage -->
  <meta charset="UTF-8">

  <!-- Makes the webpage responsive on mobile, tablet and desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title displayed in the browser tab -->
  <title>Profile | Smart Attendance</title>

  <!-- Connects this page to the main CSS stylesheet -->
  <link rel="stylesheet" href="../css/style.css">

</head>


<!--
  dashboard-body is used for pages inside the dashboard.
  The CSS file controls the overall dashboard design.
-->
<body class="dashboard-body">


  <!-- =====================================================
       MAIN DASHBOARD LAYOUT
       ===================================================== -->

  <div class="dashboard-layout">


    <!-- ===================================================
         SIDEBAR
         Contains the teacher navigation menu
         =================================================== -->

    <aside class="sidebar">


      <!-- Smart Attendance logo -->
      <!-- Clicking it takes the user back to the homepage -->
      <a class="brand" href="../index.html">

        <!-- SA = Smart Attendance -->
        <span class="brand-mark">
          SA
        </span>

        <!-- Website name -->
        <span>
          Smart Attendance
        </span>

      </a>


      <!-- =================================================
           TEACHER ROLE
           ================================================= -->

      <div class="side-role">

        <!-- Teacher avatar -->
        <span class="avatar">
          T
        </span>

        <!-- User role -->
        <div>

          <strong>
            Teacher
          </strong>

          <small>
            Portal
          </small>

        </div>

      </div>


      <!-- =================================================
           SIDEBAR NAVIGATION
           ================================================= -->

      <nav class="side-nav">


        <!-- Teacher dashboard -->
        <a class="" href="teacher-dashboard.html">
          ⌂ <span>Dashboard</span>
        </a>


        <!-- Classes page -->
        <a class="" href="classes.html">
          ▦ <span>Classes</span>
        </a>


        <!-- Attendance page -->
        <a class="" href="attendance.html">
          ✓ <span>Attendance</span>
        </a>


        <!-- Reports page -->
        <a class="" href="reports.html">
          ▥ <span>Reports</span>
        </a>


        <!-- Profile page -->
        <!-- This is the current page -->
        <a href="profile.html">
          ◉ <span>Profile</span>
        </a>

      </nav>


      <!-- Logout link -->
      <!-- Takes the user back to the login page -->
      <a class="logout" href="login.html">

        ↪ <span>Logout</span>

      </a>

    </aside>



    <!-- =====================================================
         MAIN CONTENT AREA
         ===================================================== -->

    <main class="main-area">


      <!-- ===================================================
           TOP BAR
           =================================================== -->

      <header class="topbar">


        <!-- Mobile sidebar button -->
        <button
          class="mobile-sidebar"
          aria-label="Menu">

          ☰

        </button>


        <!-- Page heading -->
        <div>

          <!-- Breadcrumb shows the current location -->
          <p class="breadcrumb">
            Portal / Profile
          </p>

          <!-- Main page title -->
          <h1>
            Profile
          </h1>

        </div>


        <!-- =================================================
             CURRENT USER INFORMATION
             ================================================= -->

        <div class="top-user">


          <!-- Notification icon -->
          <div class="notification">
            ♧
          </div>


          <!-- User avatar -->
          <span class="avatar">
            R
          </span>


          <!-- User name and role -->
          <div class="top-user-text">

            <strong>
              Rudraksh
            </strong>

            <small>
              Teacher
            </small>

          </div>

        </div>

      </header>



      <!-- =====================================================
           PROFILE PANEL
           ===================================================== -->

      <section class="panel profile-panel">


        <!-- ===================================================
             PROFILE HEADER
             Shows basic account information
             =================================================== -->

        <div class="profile-head">


          <!-- Large profile avatar -->
          <div class="profile-avatar">
            R
          </div>


          <!-- User account information -->
          <div>

            <!-- Small section label -->
            <span class="eyebrow">
              ACCOUNT
            </span>

            <!-- Full name -->
            <h2>
              Rudraksh Tiwari
            </h2>

            <!-- Department and role -->
            <p class="muted">
              Teacher • Web Technology Department
            </p>

          </div>


          <!-- Account status -->
          <span class="badge success">
            Active
          </span>

        </div>



        <!-- ===================================================
             PROFILE FORM
             =================================================== -->

        <!--
          demo-form is connected to the JavaScript.

          It represents a frontend demonstration of
          editing and saving profile information.
        -->
        <form class="demo-form">


          <!-- =================================================
               FORM GRID
               ================================================= -->

          <div class="form-grid">


            <!-- ===============================================
                 FULL NAME
                 =============================================== -->

            <div class="form-group">

              <!-- Label for name -->
              <label>
                Full name
              </label>

              <!-- Name input -->
              <!-- The value attribute displays existing data -->
              <input
                value="Rudraksh Tiwari">

            </div>



            <!-- ===============================================
                 EMAIL
                 =============================================== -->

            <div class="form-group">

              <label>
                Email
              </label>

              <!--
                type="email" tells the browser that
                this field contains an email address.
              -->
              <input
                type="email"
                value="rudraksh@example.edu">

            </div>



            <!-- ===============================================
                 EMPLOYEE / ROLL NUMBER
                 =============================================== -->

            <div class="form-group">

              <label>
                Employee / Roll No.
              </label>

              <!-- User's identification number -->
              <input
                value="058">

            </div>



            <!-- ===============================================
                 DEPARTMENT
                 =============================================== -->

            <div class="form-group">

              <label>
                Department
              </label>

              <!-- Department information -->
              <input
                value="Computer Applications">

            </div>



            <!-- ===============================================
                 PHONE NUMBER
                 =============================================== -->

            <div class="form-group">

              <label>
                Phone
              </label>

              <!-- Phone number input -->
              <input
                placeholder="+91 XXXXX XXXXX">

            </div>



            <!-- ===============================================
                 ROLE
                 =============================================== -->

            <div class="form-group">

              <label>
                Role
              </label>

              <!--
                disabled means the teacher cannot change
                their role from this form.
              -->
              <input
                value="Teacher"
                disabled>

            </div>


          </div>



          <!-- =================================================
               SAVE BUTTON
               ================================================= -->

          <button
            class="btn btn-primary">

            Save Changes

          </button>

        </form>

      </section>

    </main>

  </div>



  <!-- =====================================================
       JAVASCRIPT FILE
       
       app.js provides common interactive functionality
       used throughout the Smart Attendance project.
       ===================================================== -->

  <script src="../js/app.js"></script>

</body>
</html>
